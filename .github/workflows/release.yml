name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-msi:
    name: Build and publish Windows MSI
    runs-on: windows-2025

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install CMake for C++23 modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check cmake==4.3.0
          if ($LASTEXITCODE -ne 0) { throw 'CMake 4.3.0 installation failed.' }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the Python scripts directory.' }
          $scripts >> $env:GITHUB_PATH

      - name: Restore pinned font-generation inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --prefix tools/mathjax-bundle --include=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MathJax font input restore failed.' }

      - name: Restore pinned entity-generation sources
        uses: actions/checkout@v5
        env:
          # Preserve the Windows checkout bytes recorded by the Source lock.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'true'
        with:
          repository: mathjax/MathJax-src
          ref: fb987178c2d279a99b0db5ea02e751691703955e
          path: .reference/MathJax-src
          fetch-depth: 1
          sparse-checkout: ts/util

      - name: Initialize the x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate tag, branch, and release notes
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received '$tag'."
          }
          $version = $Matches.version
          $taggedCommit = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$tag' does not exist." }
          $sourceCommit = git rev-parse HEAD
          if ($sourceCommit -ne $taggedCommit) { throw 'Checked-out source does not match the release tag.' }

          git fetch origin master --no-tags
          git merge-base --is-ancestor $sourceCommit origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit $sourceCommit is not contained in origin/master."
          }

          $notes = "release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Build self-contained MSI
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build_msi.ps1 -Version '${{ steps.release.outputs.version }}' *>&1 |
            Tee-Object -FilePath release-build.log

      - name: Report MSI build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $diagnostic = 'The build terminated before a log file was created.'
          if (Test-Path -LiteralPath release-build.log) {
            $diagnostic = (Get-Content -LiteralPath release-build.log -Tail 80) -join "`n"
          }

          "## MSI build failure" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $diagnostic >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

          $annotation = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=MSI build failure::$annotation"
          throw 'The self-contained MSI build failed; see the job summary.'

      - name: Preserve failed build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ steps.release.outputs.tag }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            release-build.log
            build/tests/startup-msi/
            build/app-winui/bin/x64/Release/Folia.exe
            build/app-winui/bin/x64/Release/Folia.pdb

      - name: Create SHA-256 checksum
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.release.outputs.version }}'
          $msi = "build/installer/bin/Folia-$version-x64.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "Missing release asset: $msi"
          }

          $item = Get-Item -LiteralPath $msi
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$msi.sha256"
          "$hash  $($item.Name)" | Set-Content -LiteralPath $checksum -Encoding ascii

          "msi=$msi" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release.outputs.tag }}'
          $title = "Folia $tag"
          $notes = '${{ steps.release.outputs.notes }}'
          $msi = '${{ steps.assets.outputs.msi }}'
          $checksum = '${{ steps.assets.outputs.checksum }}'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release $tag." }
            gh release upload $tag $msi $checksum --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets for $tag." }
          }
          else {
            gh release create $tag $msi $checksum `
              --title $title `
              --notes-file $notes `
              --verify-tag `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }
