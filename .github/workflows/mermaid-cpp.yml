name: Mermaid C++

on:
  push:
    branches:
      - master
      - 'codex/mermaid-cpp-*'
      - feat/mermaid-cpp-port
    paths:
      - .github/workflows/mermaid-cpp.yml
      - CMakeLists.txt
      - docs/mermaid-cpp/**
      - .gitattributes
      - .gitmodules
      - third_party/mermaid-cpp/**
      - third_party/ut
      - tests/mermaid_cpp/**
      - tests/main.cpp
      - tests/support/**
      - tools/mermaid-cpp/**
      - src/core/**
      - src/platform/**
      - tools/mathjax-bundle/package*.json
      - tests/platform/mermaid_measurement.cpp
      - tools/test-support/windows_console_runtime.cpp
  pull_request:
    paths:
      - .github/workflows/mermaid-cpp.yml
      - CMakeLists.txt
      - docs/mermaid-cpp/**
      - .gitattributes
      - .gitmodules
      - third_party/mermaid-cpp/**
      - third_party/ut
      - tests/mermaid_cpp/**
      - tests/main.cpp
      - tests/support/**
      - tools/mermaid-cpp/**
      - src/core/**
      - src/platform/**
      - tools/mathjax-bundle/package*.json
      - tests/platform/mermaid_measurement.cpp
      - tools/test-support/windows_console_runtime.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.scope }} ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        scope: [standalone, integrated]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Preserve source bytes during checkout
        run: git config --global core.autocrlf false

      - name: Check out Folia and the pinned Boost.UT fork
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out the official Mermaid 12.2.0 source oracle
        uses: actions/checkout@v5
        with:
          repository: mermaid-js/mermaid
          ref: 1fb7869866dd619168d840291c9c54b4f129758b
          path: .reference/mermaid-js
          persist-credentials: false

      - name: Set up Node for the source oracle
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the locked official oracle packages
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir tools/mermaid-cpp/oracle install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the pinned Mindmap layout oracle
        run: |
          $target = 'build/mermaid-cpp/mindmap-layout-oracle'
          New-Item -ItemType Directory -Force $target | Out-Null
          $archive = Join-Path $target 'cytoscape-3.34.0.tgz'
          Invoke-WebRequest https://registry.npmjs.org/cytoscape/-/cytoscape-3.34.0.tgz -OutFile $archive
          $bytes = [IO.File]::ReadAllBytes($archive)
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($bytes))
          if ($hash -ne '62rNSrioXw93uliKFBwjukeQyeWwH2PqDrTac31r2P6464u3AUvTk0xS4LVvT251g7IgkFunrI48ZEZGjywSOg==') {
            throw 'Pinned Cytoscape 3.34.0 archive mismatch'
          }
          tar -xzf $archive -C $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore root-project generation inputs
        if: matrix.scope == 'integrated'
        run: |
          npm ci --prefix tools/mathjax-bundle --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The existing entity lock records a CRLF TypeScript checkout. Restore
          # those exact bytes from the locked npm package without changing locks.
          $lock = Get-Content docs/math-port/evidence/entities-source-lock.json -Raw | ConvertFrom-Json
          foreach ($entry in $lock.source.ts.PSObject.Properties) {
            $source = Join-Path tools/mathjax-bundle/node_modules/@mathjax/src/ts/util $entry.Name
            $target = Join-Path .reference/MathJax-src/ts/util $entry.Name
            $content = [IO.File]::ReadAllText($source) -replace "`r?`n", "`r`n"
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            [IO.File]::WriteAllText($target, $content, [Text.UTF8Encoding]::new($false))
            if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw "Pinned MathJax entity source mismatch: $($entry.Name)"
            }
          }

      - name: Check the source oracle
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git -C .reference/mermaid-js rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -ne '1fb7869866dd619168d840291c9c54b4f129758b') {
            throw 'The Mermaid source oracle is not at the pinned commit.'
          }
          New-Item -ItemType Directory -Force -Path build/mermaid-cpp | Out-Null
          node tools/mermaid-cpp/source-text-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/source-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the Packet parser and SVG oracles
        run: |
          node tools/mermaid-cpp/preprocess-text-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/frontmatter-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/directive-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/config-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/init-merge-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/session-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/detector-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/frontend-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/render-entry-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/sequence-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/class-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/quadrant-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/mindmap-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/mindmap-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/architecture-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/architecture-constraints-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/architecture-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/fcose-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/git-graph-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/block-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/kanban-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/c4-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/state-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/gantt-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/timeline-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/journey-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/treemap-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/sankey-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/xy-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/radar-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-cycle-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-layering-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-long-edges-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-ports-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-pipeline-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-restore-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-labels-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-end-labels-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-ports-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-graph-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-boundary-layers-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-boundary-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-restore-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-direction-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-compound-options-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-north-south-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-order-constraints-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-north-south-order-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-north-south-layout-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-hierarchy-order-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-hierarchy-sweep-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-routing-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-placement-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-order-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/elk-model-order-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/flowchart-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/flowchart-label-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/flowchart-graph-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/dagre-layout-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/dagre-rank-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/theme-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/generate-themes.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/number-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/packet-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/packet-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/packet-svg-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/packet-svg-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/pie-geometry-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/pie-geometry-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/pie-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/pie-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/pie-layout-oracle.mjs --check 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/pie-layout-oracle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/pie-svg-oracle.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Initialize the x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the pinned CMake 4.3.5 binary
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cmake-4.3.5-windows-x86_64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'folia-mermaid-cmake'
          $url = 'https://github.com/Kitware/CMake/releases/download/v4.3.5/cmake-4.3.5-windows-x86_64.zip'
          # SHA-256 of the official Kitware release asset.
          $expected = 'c05a60d22d5df22d75a72ae9b6628ef5f20daee4f4ba380920e1fbbeaf244fc1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "CMake archive checksum mismatch: expected $expected, got $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binaryDirectory = Join-Path $destination 'cmake-4.3.5-windows-x86_64/bin'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $binaryDirectory

      - name: Configure the C++ module project
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(cmake --version)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $versionOutput[0]
          if ($version -ne 'cmake version 4.3.5') {
            throw "The pinned CMake was not selected: $version"
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = if ('${{ matrix.scope }}' -eq 'integrated') { '.' } else { 'tools/mermaid-cpp' }
          $binary = if ('${{ matrix.scope }}' -eq 'integrated') { 'build/mermaid-cpp/tools/mermaid-cpp' } else { 'build/mermaid-cpp' }
          "FOLIA_MERMAID_BINARY_DIR=$binary" >> $env:GITHUB_ENV
          cmake -Wno-dev -G Ninja -S $source -B build/mermaid-cpp `
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the native Mermaid tests
        run: |
          $targets = @('FoliaMermaidTests', 'FoliaMermaidTextProbe', 'FoliaMermaidPlatformTests', 'FoliaMermaidHostTests')
          if ('${{ matrix.scope }}' -eq 'integrated') {
            $targets += @('FoliaTests', 'FoliaWindowsEditorTests')
          }
          cmake --build build/mermaid-cpp --parallel 4 --target $targets 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure original Flowchart SVGs in a real browser
        run: |
          node tools/mermaid-cpp/flowchart-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/flowchart-browser-probe.mjs --elk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/flowchart-elk-oracle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/sequence-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/class-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/quadrant-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/mindmap-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/git-graph-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/block-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/kanban-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/c4-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/architecture-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/state-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/gantt-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/timeline-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/journey-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/treemap-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/sankey-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/xy-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/radar-browser-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the native Mermaid tests
        run: |
          $env:FOLIA_MERMAID_SVG_OUTPUT = Join-Path $pwd 'build/mermaid-cpp/pie-svg'
          $env:FOLIA_MERMAID_XY_MEASUREMENTS = Join-Path $pwd 'build/mermaid-cpp/xy-browser/measurements.tsv'
          $env:FOLIA_MERMAID_MINDMAP_MEASUREMENTS = Join-Path $pwd 'build/mermaid-cpp/mindmap-browser/measurements.tsv'
          $env:FOLIA_MERMAID_ARCHITECTURE_MEASUREMENTS = Join-Path $pwd 'build/mermaid-cpp/architecture-browser/measurements.tsv'
          # Match built suites exactly; unrelated optional Math/encoding/spec
          # runners are not part of the Mermaid integration check.
          ctest --test-dir build/mermaid-cpp --output-on-failure --no-tests=error `
            -R '^Folia(MermaidTests|MermaidPlatformTests|MermaidHostTests|Tests|WindowsEditorTests)$' 2>&1 |
            Tee-Object -FilePath build/mermaid-cpp/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-flowchart-svg.mjs build/mermaid-cpp/flowchart-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-flowchart-svg.mjs build/mermaid-cpp/elk-flowchart-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-sequence-svg.mjs build/mermaid-cpp/sequence-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-class-svg.mjs build/mermaid-cpp/class-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-quadrant-svg.mjs build/mermaid-cpp/quadrant-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-mindmap-svg.mjs build/mermaid-cpp/mindmap-browser/shapes.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-git-graph-svg.mjs build/mermaid-cpp/git-graph-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-block-svg.mjs build/mermaid-cpp/block-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-kanban-svg.mjs build/mermaid-cpp/kanban-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-c4-svg.mjs build/mermaid-cpp/c4-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-architecture-svg.mjs build/mermaid-cpp/architecture-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-state-svg.mjs build/mermaid-cpp/state-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-gantt-svg.mjs build/mermaid-cpp/gantt-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-timeline-svg.mjs build/mermaid-cpp/timeline-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-journey-svg.mjs build/mermaid-cpp/journey-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-treemap-svg.mjs build/mermaid-cpp/treemap-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-sankey-svg.mjs build/mermaid-cpp/sankey-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-xy-svg.mjs build/mermaid-cpp/xy-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-xy-svg.mjs build/mermaid-cpp/xy-browser/original.json build/mermaid-cpp/pie-svg --oracle-measurements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-radar-svg.mjs build/mermaid-cpp/radar-browser/original.json build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/pie-svg-oracle.mjs --compare build/mermaid-cpp/pie-svg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare real browser and DirectWrite text measurements
        run: |
          node tools/mermaid-cpp/browser-text-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:FOLIA_MERMAID_BINARY_DIR/FoliaMermaidTextProbe.exe" build/mermaid-cpp/browser-text.tsv build/mermaid-cpp/native-text.tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/mermaid-cpp/compare-text-probe.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload text measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-text-${{ matrix.scope }}-${{ matrix.configuration }}
          path: |
            build/mermaid-cpp/*text.tsv
            build/mermaid-cpp/browser-text.json
            build/mermaid-cpp/text-comparison.json
            build/mermaid-cpp/pie-svg/*.svg
            build/mermaid-cpp/flowchart-browser/*.json
            build/mermaid-cpp/elk-flowchart-browser/*.json
            build/mermaid-cpp/elk-flowchart-browser/*.svg
            build/mermaid-cpp/flowchart-browser/*.svg
            build/mermaid-cpp/sequence-browser/*.json
            build/mermaid-cpp/sequence-browser/*.svg
            build/mermaid-cpp/class-browser/*.json
            build/mermaid-cpp/class-browser/*.svg
            build/mermaid-cpp/quadrant-browser/*.json
            build/mermaid-cpp/quadrant-browser/*.svg
            build/mermaid-cpp/mindmap-browser/*.json
            build/mermaid-cpp/mindmap-browser/*.tsv
            build/mermaid-cpp/git-graph-browser/*.json
            build/mermaid-cpp/git-graph-browser/*.svg
            build/mermaid-cpp/block-browser/*.json
            build/mermaid-cpp/block-browser/*.svg
            build/mermaid-cpp/kanban-browser/*.json
            build/mermaid-cpp/kanban-browser/*.svg
            build/mermaid-cpp/c4-browser/*.json
            build/mermaid-cpp/c4-browser/*.svg
            build/mermaid-cpp/architecture-browser/*.json
            build/mermaid-cpp/architecture-browser/*.tsv
            build/mermaid-cpp/architecture-browser/*.svg
            build/mermaid-cpp/state-browser/*.json
            build/mermaid-cpp/state-browser/*.svg
            build/mermaid-cpp/gantt-browser/*.json
            build/mermaid-cpp/gantt-browser/*.svg
            build/mermaid-cpp/timeline-browser/*.json
            build/mermaid-cpp/timeline-browser/*.svg
            build/mermaid-cpp/journey-browser/*.json
            build/mermaid-cpp/journey-browser/*.svg
            build/mermaid-cpp/treemap-browser/*.json
            build/mermaid-cpp/treemap-browser/*.svg
            build/mermaid-cpp/sankey-browser/*.json
            build/mermaid-cpp/sankey-browser/*.svg
            build/mermaid-cpp/xy-browser/*.json
            build/mermaid-cpp/xy-browser/*.svg
            build/mermaid-cpp/xy-browser/*.tsv
            build/mermaid-cpp/radar-browser/*.json
            build/mermaid-cpp/radar-browser/*.svg
            ${{ env.FOLIA_MERMAID_BINARY_DIR }}/FoliaMermaidTextProbe.exe
            ${{ env.FOLIA_MERMAID_BINARY_DIR }}/FoliaMermaidPlatformTests.exe
            ${{ env.FOLIA_MERMAID_BINARY_DIR }}/FoliaMermaidHostTests.exe
            ${{ env.FOLIA_MERMAID_BINARY_DIR }}/FoliaNativeMermaid.dll

      - name: Upload the native test executable
        if: always() && hashFiles('build/mermaid-cpp/**/FoliaMermaidTests.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-cpp-${{ matrix.scope }}-${{ matrix.configuration }}-tests
          path: ${{ env.FOLIA_MERMAID_BINARY_DIR }}/FoliaMermaidTests.exe

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-cpp-${{ matrix.scope }}-${{ matrix.configuration }}-diagnostics
          if-no-files-found: ignore
          path: |
            build/mermaid-cpp/*.log
            build/mermaid-cpp/CMakeFiles/CMakeConfigureLog.yaml
            build/mermaid-cpp/Testing/Temporary/*.log
