name: Retract incorrect v1.0.1 release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  retract:
    name: Remove the incorrectly versioned release
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.1 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Verify removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY"; then
            echo "::error::The incorrect v1.0.1 release still exists."
            exit 1
          fi
